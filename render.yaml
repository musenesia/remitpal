# Render Blueprint for RemitPal — Migrant Worker Expense Tracker
# Deploy with: render blueprint deploy (or via Render Dashboard > New > Blueprint)

databases:
  - name: remitpal-db
    plan: free
    ipAllowList: []   # Allow connections from Render services only

services:
  - type: web
    name: remitpal
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: remitpal-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false   # Set this manually in the Render dashboard
      - key: OPENROUTER_API_KEY
        sync: false   # Fallback AI key (openrouter.ai) — used automatically when Gemini is overloaded (503/429)
      - key: OPENROUTER_MODEL
        sync: false   # Defaults in code to nvidia/nemotron-3.5-super-vl:free if unset
      - key: APP_URL
        sync: false   # Set this to your Render service URL after first deploy
      - key: PAYPAL_CLIENT_ID
        sync: false   # PayPal sandbox REST app client ID
      - key: PAYPAL_CLIENT_SECRET
        sync: false   # PayPal sandbox REST app secret
      - key: PAYPAL_RECIPIENT_EMAIL
        sync: false   # Slamet's sandbox personal PayPal account email
